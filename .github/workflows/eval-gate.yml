# ③ release/* → stg の PR で動く関所。
# リリース候補のイメージ（dev へのマージ時にビルド済み）を rc Runtime に差し替えて評価する。
# 閾値を下回ればこのチェックが失敗する（stg ブランチの保護ルールでマージを止める）。
name: eval-gate

on:
  pull_request:
    branches: [stg]
    types: [opened, synchronize, reopened]

# rc Runtime は 1 つしかないので、評価は同時に 1 件だけ。待機中は最新の 1 件が残る
concurrency:
  group: rc-runtime
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      AWS_REGION: ap-northeast-1
      PYTHONUNBUFFERED: "1"
    steps:
      # ジョブに if: を付けると条件外で skipped になり、必須チェックを素通りしてしまう。
      # そのため条件外は明示的に失敗させる
      - name: release/* からの PR か確かめる
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [[ "$HEAD_REF" != release/* ]]; then
            echo "::error::stg へは、このリポジトリの release/* ブランチからの PR だけを受け付ける（head: $HEAD_REPO:$HEAD_REF）"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 評価すべきイメージタグを計算
        id: tag
        run: echo "tag=$(git rev-parse HEAD:agent)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_EVAL_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --group eval

      - name: rc Runtime をリリース候補のイメージに差し替える
        # release を切った直後で dev のビルドが終わっていなければ、最大 15 分待つ
        run: uv run python eval/deploy_rc.py --image-tag ${{ steps.tag.outputs.tag }} --wait-image-seconds 900

      - name: rc Runtime を評価
        run: |
          uv run python eval/run_eval.py --runtime-name michikusa_rc \
            --expected-image-tag ${{ steps.tag.outputs.tag }}

      - name: PR に結果をコメント
        if: always() && hashFiles('eval/results/report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file eval/results/report.md --edit-last --create-if-none

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results
          path: eval/results/
          if-no-files-found: ignore
