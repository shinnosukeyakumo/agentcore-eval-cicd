# ③ dev → stg の PR で動く関所。dev 環境で動いているエージェントを評価し、
# 閾値を下回ればこのチェックが失敗する（stg ブランチの保護ルールでマージを止める）。
name: eval-gate

on:
  pull_request:
    branches: [stg]
    types: [opened, synchronize, reopened]

# PR が更新されたら古い評価は打ち切る
concurrency:
  group: eval-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    # このリポジトリ自身の dev ブランチからの PR だけを評価する（フォークからの PR では動かさない）
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      AWS_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 評価すべきイメージタグを計算
        id: tag
        run: echo "tag=$(git rev-parse HEAD:agent)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_EVAL_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: dev Runtime を評価
        id: eval
        run: |
          uv sync --locked --group eval
          # dev へのデプロイが追いついていなければ最大 15 分待つ
          uv run python eval/run_eval.py --runtime-name michikusa_dev \
            --expected-image-tag ${{ steps.tag.outputs.tag }} --wait-image-seconds 900

      - name: PR に結果をコメント
        if: always() && hashFiles('eval/results/report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file eval/results/report.md --edit-last --create-if-none

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results
          path: eval/results/
          if-no-files-found: ignore
